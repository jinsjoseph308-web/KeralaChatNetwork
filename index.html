<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Malayalam Chat Groups</title>

<style>
body{
    font-family: Arial;
    background:#0f172a;
    color:white;
    text-align:center;
}

h1{
    margin:20px;
}

/* Search Box */
input{
    padding:10px;
    width:80%;
    max-width:400px;
    border-radius:8px;
    border:none;
    margin-bottom:20px;
}

/* Buttons */
.buttons button{
    margin:5px;
    padding:8px 12px;
    border:none;
    border-radius:6px;
    background:#22c55e;
    color:white;
    cursor:pointer;
}

/* Cards */
.container{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
}

.card{
    background:#1e293b;
    padding:15px;
    margin:10px;
    border-radius:10px;
    width:250px;
}

a{
    display:inline-block;
    margin-top:10px;
    padding:8px 12px;
    background:#38bdf8;
    color:white;
    text-decoration:none;
    border-radius:5px;
}
</style>
</head>

<body>

<h1>💬 Malayalam Chat Groups</h1>

<input type="text" id="search" placeholder="Search group...">

<div class="buttons">
    <button onclick="filter('all')">All</button>
    <button onclick="filter('friends')">Friends</button>
    <button onclick="filter('fun')">Fun</button>
    <button onclick="filter('study')">Study</button>
</div>

<div class="container" id="groups">

<div class="card" data-category="friends">
    <h3>👫 Friends Chat</h3>
    <p>Malayalam friendly chatting</p>
    <a href="https://t.me/Malayalamchatgroups">Join</a>
</div>

<div class="card" data-category="fun">
    <h3>😂 Fun Chat</h3>
    <p>Memes & fun talks</p>
    <a href="#">Join</a>
</div>

<div class="card" data-category="study">
    <h3>📚 Study Chat</h3>
    <p>Students discussion</p>
    <a href="#">Join</a>
</div>

</div>

<script>
// Search
document.getElementById("search").addEventListener("keyup", function() {
    let value = this.value.toLowerCase();
    let cards = document.querySelectorAll(".card");

    cards.forEach(card => {
        card.style.display = card.innerText.toLowerCase().includes(value) ? "block" : "none";
    });
});

// Filter
function filter(category){
    let cards = document.querySelectorAll(".card");

    cards.forEach(card => {
        if(category === "all" || card.dataset.category === category){
            card.style.display = "block";
        } else {
            card.style.display = "none";
        }
    });
}
</script>

</body>
</html>
