<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Malayalam Chat Groups</title>

<style>
body{
    font-family: Arial;
    background:#0f172a;
    color:white;
    text-align:center;
}

/* Slider */
.slider{
    width:90%;
    max-width:800px;
    margin:20px auto;
}

.slide{
    width:100%;
    display:none;
    border-radius:10px;
}

.active{
    display:block;
}

/* Search */
input{
    padding:10px;
    width:80%;
    max-width:400px;
    border-radius:8px;
    border:none;
    margin-bottom:20px;
}

/* Buttons */
.buttons button{
    margin:5px;
    padding:8px 12px;
    border:none;
    border-radius:6px;
    background:#22c55e;
    color:white;
    cursor:pointer;
}

/* Cards */
.container{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
}

.card{
    background:#1e293b;
    border-radius:12px;
    overflow:hidden;
    width:260px;
    margin:10px;
    position:relative;
    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
}

/* Badge */
.badge{
    position:absolute;
    top:10px;
    left:10px;
    background:red;
    color:white;
    padding:5px 10px;
    font-size:12px;
    border-radius:6px;
}

/* Image */
.card img{
    width:100%;
    height:160px;
    object-fit:cover;
}

/* Content */
.card-content{
    padding:15px;
}

/* Button */
.card a{
    display:block;
    margin-top:10px;
    padding:10px;
    background:#22c55e;
    color:white;
    text-decoration:none;
    border-radius:6px;
}

.card a:hover{
    background:#16a34a;
}
</style>
</head>

<body>

<!-- 🔥 Slider -->
<div class="slider">
    <img src="https://via.placeholder.com/800x300" class="slide active">
    <img src="https://via.placeholder.com/800x300" class="slide">
    <img src="https://via.placeholder.com/800x300" class="slide">
</div>

<h1>💬 Malayalam Chat Groups</h1>

<input type="text" id="search" placeholder="Search group...">

<div class="buttons">
    <button onclick="filter('all')">All</button>
    <button onclick="filter('friends')">Friends</button>
    <button onclick="filter('fun')">Fun</button>
    <button onclick="filter('study')">Study</button>
</div>

<div class="container">

<!-- 🔥 Card 1 -->
<div class="card" data-category="friends">
    <div class="badge">🔥 Trending</div>

    <img src="https://via.placeholder.com/300x180">

    <div class="card-content">
        <h3>👫 Friends Chat</h3>
        <p>Malayalam friendly chatting</p>
        <a href="https://t.me/Malayalamchatgroups" target="_blank">Join Now</a>
    </div>
</div>

<!-- Card 2 -->
<div class="card" data-category="fun">
    <img src="https://via.placeholder.com/300x180">
    <div class="card-content">
        <h3>😂 Fun Chat</h3>
        <p>Memes & fun talks</p>
        <a href="#" target="_blank">Join Now</a>
    </div>
</div>

<!-- Card 3 -->
<div class="card" data-category="study">
    <img src="https://via.placeholder.com/300x180">
    <div class="card-content">
        <h3>📚 Study Chat</h3>
        <p>Students discussion</p>
        <a href="#" target="_blank">Join Now</a>
    </div>
</div>

</div>

<script>
// 🔍 Search
document.getElementById("search").addEventListener("keyup", function() {
    let value = this.value.toLowerCase();
    let cards = document.querySelectorAll(".card");

    cards.forEach(card => {
        card.style.display = card.innerText.toLowerCase().includes(value) ? "block" : "none";
    });
});

// 📂 Filter
function filter(category){
    let cards = document.querySelectorAll(".card");

    cards.forEach(card => {
        if(category === "all" || card.dataset.category === category){
            card.style.display = "block";
        } else {
            card.style.display = "none";
        }
    });
}

// 🎞️ Slider Auto
let index = 0;
let slides = document.querySelectorAll(".slide");

function showSlide(){
    slides.forEach(s => s.classList.remove("active"));
    slides[index].classList.add("active");
    index = (index + 1) % slides.length;
}

setInterval(showSlide, 3000);
</script>

</body>
</html>
