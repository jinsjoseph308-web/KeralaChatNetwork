<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Friends Chat Join</title>

<style>
body{
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg,#0f172a,#1e3a8a);
    color:white;
    text-align:center;
    padding:30px;
}

/* Box (Glass effect) */
.box{
    background: rgba(30,41,59,0.7);
    backdrop-filter: blur(10px);
    padding:25px;
    border-radius:15px;
    max-width:400px;
    margin:auto;
    box-shadow:0 10px 30px rgba(0,0,0,0.5);
}

/* Image */
img{
    width:100%;
    height:180px;
    object-fit:cover;
    border-radius:12px;
    margin-bottom:15px;
}

/* Title */
h2{
    margin-bottom:5px;
}

/* Buttons */
a{
    display:block;
    margin-top:12px;
    padding:12px;
    background:#22c55e;
    color:white;
    text-decoration:none;
    border-radius:8px;
    transition:0.3s;
}

/* Hover effect */
a:hover{
    transform:scale(1.05);
    opacity:0.9;
}

/* Back button */
.back{
    background:#334155;
}

/* Add group button */
.add{
    background:#f59e0b;
}

/* Footer */
.footer{
    margin-top:30px;
    font-size:14px;
    opacity:0.7;
}
</style>
</head>

<body>

<div class="box">

    <img src="https://picsum.photos/400/200?random=1">

    <h2>👫 Friends Chat</h2>
    <p>Malayalam friendly chatting group</p>

    <!-- Join -->
    <a href="https://t.me/Malayalamchatgroups" target="_blank">
        🚀 Join Telegram
    </a>

    <!-- ➕ Add Your Group -->
    <a href="https://t.me/Charliecharlieodiyan?text=Hi%20I%20want%20to%20add%20my%20group%0AGroup%20Name:%20%0ALink:%20%0ADescription:%20" 
       target="_blank" class="add">
       ➕ Add Your Group
    </a>

    <!-- Back -->
    <a href="index.html" class="back">
        ⬅ Back
    </a>

</div>

<div class="footer">
    ©2026 Malayalam Chat Groups
</div>

</body>
</html>
