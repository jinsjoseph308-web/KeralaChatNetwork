<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Friends Chat Join</title>

<style>
body{
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg,#0f172a,#1e3a8a);
    color:white;
    text-align:center;
    padding:30px;
}

/* Box */
.box{
    background: rgba(30,41,59,0.7);
    backdrop-filter: blur(10px);
    padding:25px;
    border-radius:15px;
    max-width:400px;
    margin:auto;
    box-shadow:0 10px 30px rgba(0,0,0,0.5);
}

/* Image */
img{
    width:100%;
    height:180px;
    object-fit:cover;
    border-radius:12px;
    margin-bottom:15px;
}

/* Buttons */
a{
    display:block;
    margin-top:12px;
    padding:12px;
    background:#22c55e;
    color:white;
    text-decoration:none;
    border-radius:8px;
    transition:0.3s;
}

a:hover{
    transform:scale(1.05);
    opacity:0.9;
}

/* Special buttons */
.back{ background:#334155; }
.add{ background:#f59e0b; }

/* Divider */
hr{
    margin:25px 0;
    border:0;
    height:1px;
    background:#334155;
}

/* Footer */
.footer{
    margin-top:30px;
    font-size:14px;
    opacity:0.7;
}
</style>
</head>

<body>

<div class="box">

    <!-- 🔥 Group 1 -->
    <img src="https://picsum.photos/400/200?random=1">
    <h2>👫 Friends Chat</h2>

    <a href="https://t.me/Malayalamchatgroups" target="_blank">

    </a>

    </a>

    <!-- 🔥 Group 3 -->

    <h2>🗣 Kerala Chat</h2>

    <a href="https://t.me/YOUR_GROUP_LINK_3" target="_blank">
        🚀 Join Telegram
