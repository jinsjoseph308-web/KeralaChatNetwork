<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Friends Chat Join</title>

<style>
body{
    font-family: Arial;
    background:#0f172a;
    color:white;
    text-align:center;
    padding:30px;
}

/* Box */
.box{
    background:#1e293b;
    padding:25px;
    border-radius:12px;
    max-width:400px;
    margin:auto;
}

/* Image */
img{
    width:100%;
    height:180px;
    object-fit:cover;
    border-radius:10px;
    margin-bottom:15px;
}

/* Buttons */
a{
    display:block;
    margin-top:12px;
    padding:12px;
    background:#22c55e;
    color:white;
    text-decoration:none;
    border-radius:6px;
}

/* Back button */
.back{
    background:#334155;
}

/* Add group button */
.add{
    background:#f59e0b;
}
</style>
</head>

<body>

<div class="box">

    <img src="https://picsum.photos/400/200?random=1">

    <h2>👫 Friends Chat</h2>
    <p>Malayalam friendly chatting group</p>

    <!-- Join -->
    <a href="https://t.me/Malayalamchatgroups" target="_blank">
        Join Telegram
    </a>

    <!-- ➕ Add Your Group -->
    <a href="https://t.me/Charliecharlieodiyan?text=Hi%20I%20want%20to%20add%20my%20group%0AGroup%20Name:%20%0ALink:%20%0ADescription:%20" 
       target="_blank" class="add">
       ➕ Add Your Group
    </a>

    <!-- Back -->
    <a href="index.html" class="back">
        ⬅ Back
    </a>

</div>

</body>
</html>
